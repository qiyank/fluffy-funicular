name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: todo_workbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libffi-dev libssl-dev cmake build-essential ccache

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython==3.0.11" buildozer virtualenv

      - name: 打包 APK（首次约 20~40 分钟）
        run: |
          buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-workbench-apk
          path: todo_workbench/bin/*.apk
          if-no-files-found: error
